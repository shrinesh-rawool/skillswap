{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<div class="container pb-5">
  <div class="form-page">
    <div class="form-page-header">
      <h2>Edit profile</h2>
      <p class="text-muted">Update your public information</p>
    </div>
    <div class="form-card">
      <form method="POST" action="{{ url_for('edit_profile') }}" novalidate>
        <div class="text-center mb-4">
          <div class="profile-avatar-lg" style="background:{{ user.avatar_color }}">{{ user.name[0].upper() }}</div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Full name *</label>
          <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">University <span class="text-muted">(optional)</span></label>
          <input type="text" name="university" class="form-control" value="{{ user.university or '' }}" placeholder="Your university or school">
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Bio <span class="text-muted">(optional)</span></label>
          <textarea name="bio" class="form-control" rows="3" placeholder="Tell others a bit about yourself…" maxlength="300">{{ user.bio or '' }}</textarea>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary px-5">Save changes</button>
          <a href="{{ url_for('profile', uid=user.id) }}" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
